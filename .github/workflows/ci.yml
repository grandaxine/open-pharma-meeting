name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: OPMS_FIXTURE_PATH=/tmp/opms-native-fixture.json swift test
      - name: Validate native export against public schema
        run: |
          python3 -m venv /tmp/opms-validation
          /tmp/opms-validation/bin/pip install -r requirements-dev.txt
          /tmp/opms-validation/bin/python scripts/validate_native_fixture.py /tmp/opms-native-fixture.json
      - name: Build iPad application without signing
        run: xcodebuild -project OpenPharmaMeeting.xcodeproj -scheme OpenPharmaMeeting -destination 'generic/platform=iOS' -derivedDataPath /tmp/opms-derived CODE_SIGNING_ALLOWED=NO build
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/test_protocol.py
      - run: python scripts/check_public_source.py
      - name: Verify generated artifacts stay reproducible
        run: |
          python scripts/generate_project.py
          python scripts/generate_protocol.py
          git diff --exit-code
